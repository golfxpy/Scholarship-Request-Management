name: scholarship-request-management

services:
  db:
    image: postgres:18.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarship}
      POSTGRES_USER: ${POSTGRES_USER:-scholarship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: src/ScholarshipRequest.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-scholarship};Username=${POSTGRES_USER:-scholarship};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DataProtection__KeysPath: /var/lib/scholarship/keys
      DevelopmentDemoSeed__Enabled: "true"
      DevelopmentDemoSeed__AdminUserName: ${DEMO_ADMIN_USERNAME:-admin}
      DevelopmentDemoSeed__AdminPassword: ${DEMO_ADMIN_PASSWORD:-Scholarship@2569}
    volumes:
      - data-protection-keys:/var/lib/scholarship/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: src/ScholarshipRequest.Client/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - edge
      - backend

volumes:
  postgres-data:
  data-protection-keys:

networks:
  edge:
  backend:
    internal: true
